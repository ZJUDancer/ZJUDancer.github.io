{{- $pdfs := slice -}}
{{- range .Resources -}}
  {{- if eq .MediaType.SubType "pdf" -}}
    {{- $pdfs = $pdfs | append . -}}
  {{- end -}}
{{- end -}}
{{- with $pdfs }}
  <div class="docs-downloads">
    <span class="docs-downloads-label">附件</span>
    <div class="docs-download-list">
      {{- range . }}
        <a class="docs-download" href="{{ .RelPermalink }}" target="_blank" rel="noopener">
          <i class="fa-solid fa-file-pdf" aria-hidden="true"></i>
          <span>{{ .Name }}</span>
        </a>
      {{- end }}
    </div>
  </div>
{{- end }}
