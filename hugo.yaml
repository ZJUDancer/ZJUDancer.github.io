# ⚠️ 托管在仓库子路径下时，baseURL 必须写完整地址（形如
# https://<github_username>.github.io/<repo_name>/），否则图片等资源路径会错。
# 下面是 GitHub Pages「项目站点」的地址，前提是本仓库名为 website。
# 部署时由工作流用 `-b` 覆盖（见 .github/workflows/deploy-pages.yml），
# Netlify 也用自己的域名覆盖（见 netlify.toml）。本地 `mise run build` 只会用这里的值。
baseURL: https://zjudancer.github.io/website/

locale: zh-cn
title: "ZJUDancer"

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    # 整目录发布项目自己的 static/。
    # 注意：Hugo 里一旦为某个部件显式写了 mounts，该部件的默认挂载就不再生效，
    # 所以这里必须自己把 static 挂上。以前这里只挂了 static/files，
    # 结果 static/ 下的其他文件（例如 static/videos/*）从来没有被发布出去过。
    - source: static
      target: static
    # /flags（国旗）、/files（Mulish 字体）、/fonts（KaTeX 字体）这三项由主题自己的
    # hugo.yaml 挂载（module.mounts），项目里不需要重复声明。

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
languages:
  en:
    locale: en
    label: English
    title: "ZJUDancer"
    weight: 1
  zh-cn:
    locale: zh-cn
    label: 简体中文
    title: "ZJUDancer"
    weight: 2
# default language for the content
defaultContentLanguage: en

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 站点没有博文/笔记，主题的分类页（/tags/、/categories/）只会生成一堆空页面，
# 这里直接关掉这两类页面的生成。将来若重新启用带标签的内容，删掉这个配置即可。
disableKinds:
  - taxonomy
  - term

# Enable global emoji support
enableEmoji: true

# Site parameters
params:
  # Background images of the landing page, crossfading on a 5-second cycle
  backgrounds:
    - /images/site/2026RoboCupIncheonZJUDancerHamburgBitBots.png
    - /images/site/2026RoboCupChinaOpenZJUDancer.png

  # Provide logos for your site. The inverted logo will be used in the initial
  # transparent navbar and the main logo will be used in the non-transparent navbar.
  logo:
    main: /images/site/zjudancerlogo.png
    inverted: /images/site/zjudancerlogo.png
    favicon: /images/site/zjudancerfavicon.png

  # GitHub repo of your site
  gitRepo: https://github.com/ZJUDancer/ZJUDancer.github.io/tree/new_website
  # Default branch of your Git repo
  gitBranch: new_website

  # Configure the number of section title visible in the top navbar
  topNavbar:
    maxVisibleSections: 5

  # Configure various features of this theme
  features:
    # [Deprecated] Enable dark theme
    # This is a deprecated setting, but has not been removed to maintain backward compatibility
    # If `theme` is set, the `darkMode` setting will be discarded.
    # darkMode:
    #   enable: true

    # Configure theme color settings
    theme:
      enable: true
      services:
        light: true # enable light theme. default "true"
        dark: true # enable dark theme. default "true"
        default: system # can be either light, dark or system. default "system"

    # Enable and configure portfolio
    portfolio:
      enable: true

    # 博文（posts）关闭：本站不提供博客，只在导航保留「文档」
    # Enable and configure blog posts
    blog:
      enable: false
      showAuthor: true # shows the author of post (defaults true)
      # Share post on different social media
      shareButtons:
        facebook: false
        twitter: false
        linkedin: false
        reddit: false
        whatsapp: false
        email: true
        # tumblr: true
        # pocket: true
        # diaspora: true
        # mastodon: true

    # 笔记（notes）关闭：本站不提供笔记
    # Enable & configure "Notes" features
    notes:
      enable: false

    # Enable comment feature. There, should be only one of them.
    comment:
      enable: false
      services:
        disqus:
          # 评论功能当前关闭，这里的值还不生效。将来若要启用 Disqus，
          # 请把 shortName 改成我们自己在 Disqus 后台注册的 shortname。
          shortName: zjudancer
          # valine:
          #   appId: HTV6askWxVo3vOxlqjjaq2hd-MsYXbMMI
          #   appKey: pVrT3C85KGIuk27t07eh6bUC
          #   avatar: retro
          #   placeholder: Share your thought.
          #   lang: en
          #   recordIP: true
          #   enableQQ: true
          # utteranc:
          #   repo: github.com/hugo-toha/hugo-toha.github.io
          #   issueTerm: title
          #   theme: github-light
          # giscus:
          #   repo: your-repo/name
          #   repoID: your-repo-id
          #   category: your-category
          #   categoryID: your-category-id
          # theme: light
          # map: url
          # reaction: 1
          # metadata: 0
          # inputPosition: bottom
          # crossOrigin: anonymous
          # commento:
          #   serverURL: cdn.commento.io
          #   autoInit: true
          #   hideDeleted: false

          # Enable Analytics
    analytics:
      enable: true
      services:
        # Google Analytics
        google:
          id: G-H4LBG7NDFZ
        # # CounterDev
        # counterDev:
        #   id: <your counterdev id>
        # # GoatCounter
        # goatCounter:
        #   code: <your goat counter code>
        # # Matomo / Piwik
        # matomo:
        #   instance: matomo.example.com
        #   siteId: 1 # Or any other number

        # Enable Support
    support:
      enable: false
      services:
        kofi:
          user: hossainemruz
          text: Tip Me
          textColor: '#f9fafc'
          backgroundColor: '#248aaa'
        # buymeacoffee:
        #   user: <your buymeacoffee.com user>
        #   text: Support me on Buy me a coffee!
        #   info: Buy me a coffee!
        #   color: '#FFDD00'

        # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true
      on_card: true # enables tags in post cards

    # Specify whether to show flag in the language selector. Default is true.
    flags:
      enable: true
      # # If you want to use different country flag for a language, specify them here.
      # flagOverwrites:
      #   - languageCode: en
      #     countryCode: us

      # ---- 下面这些「内容类功能」本站一律关闭 ----
      # 主题会把每个功能的 JS 都打进同一个 application.js，只有关掉开关才会在构建期被裁掉。
      # 这个站点没有任何博文/笔记内容（blog、notes 都是关的），所以这些代码纯属白下载：
      # 六项全开时 JS 是 6.1 MB（gzip 1.8 MB），全关后降到 1.8 MB（gzip 0.6 MB）。
      # 将来如果要写带公式、代码块、流程图、PDF、视频的页面，把对应项改回 true 即可。

      # Enable this to use `embed-pdf` shortcode.
    embedpdf:
      enable: false

    # Enable this to create flowcharts using shortcodes.
    flowchart:
      enable: false
      services:
        # Uncomment for `mermaid` shortcode.
        mermaid:
          # For config options, see: https://mermaid-js.github.io/mermaid/#/Setup?id=configuration
          theme: forest

    # Enable this to create mathematic expressions using `$$` blocks
    math:
      enable: false
      services:
        # https://katex.org/docs/autorender.html#api for more configurations
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: $
              right: $
              display: false
            - left: \\(
              right: \\)
              display: false

    # Enable to use custom syntax highlight
    # Please note, Hugo comes with it's own html based syntax highlighter.
    # Your code block will still be syntax highlighted by hugo.
    # For more details: https://gohugo.io/content-management/syntax-highlighting/
    # To disable Hugo's builtin syntax highlight,
    # see: https://gohugo.io/getting-started/configuration-markup#highlight
    # ```
    # # config.yaml
    # markup:
    #   # this disables hugo's syntax highlighting.
    #   codeFences: false
    # ```
    syntaxHighlight:
      enable: false
      services:
        hljs:
          # see: https://highlightjs.readthedocs.io/en/latest/api.html#configure
          noHighlightRe: /^no-highlight$/i

    # Enable to use `video-player` shortcode
    videoPlayer:
      enable: false
      services:
        # convert .js-player class into video player via https://plyr.io/
        # Can play HTML5 Video, Audio, Youtube, Vimeo.
        # For more info on setup: https://github.com/sampotts/plyr#quick-setup
        plyr:
          # options doc: https://github.com/sampotts/plyr#options
          # fullscreen: true

          # Enables copy code button
    copyCodeButton:
      enable: false

    # Enable reading time support in post cards and in post pages
    readingTime:
      enable: false

    # Number of posts to show to each page. Default is "12"
    pagination:
      maxPostsPerPage: 12

  # Provide footer configuration.
  footer:
    enable: true
    # You can provide your custom footer template using this option.
    # Put your template in "layouts/partials" folder of your repo.
    template: footer.html
    # Show/hide navigation in the footer. Default is "true".
    navigation:
      enable: true
      # show custom menus in the footer
      customMenus: true
    # Show/hide "Contact Me" section in the footer. Default is "true".
    contactMe:
      enable: true
    # Show/hide credentials section in the footer. Default is "true".
    credentials:
      enable: true

    # Show/hide newsletter section in the footer. Default is "true".
    # Currently, it supports "mailchimp".
    newsletter:
      enable: false
      # provider: mailchimp
      # mailchimpURL: https://github.us1.list-manage.com/subscribe/post?u=19de52a4603135aae97163fd8&amp;id=094a24c76e

      # Show/hide disclaimer notice in the footer. Default is "false".
    disclaimer:
      enable: true
