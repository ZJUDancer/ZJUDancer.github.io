# section information
section:
  name: About
  id: about
  enable: true
  weight: 1
  showOnNavbar: true
  # Still on the home page and still listed in the footer navigation — just not in
  # the top navbar any more (read by layouts/partials/navigators/navbar.html).
  hideFromTopNavbar: true
  template: sections/about.html

# your designation
designation: A team for RoboCup HSL
# your company information
company:
  name: CSE, ZJU
  url: "http://www.cse.zju.edu.cn"

# your resume. this file path should be relative to you "static" directory
# Dreprecated. Use resourceLinks instead.
# resume: "files/resume.pdf"

# a summary about you
summary: "Supported by the State Key Laboratory of Industrial Control Technology and Zhejiang University's Robotics Science and Education Practice Base, ZJUDancer was founded in 2006. Over the 20 years since its establishment, ZJUDancer has grown from independently designing and manufacturing robots to refining the code for modules such as motion control, visual perception, and behavioral decision-making, gradually developing into a highly competitive powerhouse in the Humanoid League."

# your social links
# give as many as you want. use font-awesome for the icons.
# Notes:
#   * The entry named "Email" gets a mailto: prefix from the theme template,
#     so keep that name as is.
#   * Icons are FontAwesome classes (the theme bundles the full FontAwesome 6).
#     Xiaohongshu has no official FontAwesome icon; it uses the custom
#     social-icon-xiaohongshu class defined in assets/styles/override.scss.
#   * url: "#" is a placeholder — replace it once the real profile URL is known.
socialLinks:
- name: Email
  icon: "fas fa-envelope"
  url: "yiran.robotics@gmail.com"

- name: Github
  icon: "fab fa-github"
  url: "https://github.com/ZJUDancer"

- name: YouTube
  icon: "fab fa-youtube"
  url: "https://www.youtube.com/@ZJUDancer" 

- name: Bilibili
  icon: "fab fa-bilibili"
  url: "https://space.bilibili.com/3546773001866106?spm_id_from=333.337.0.0" 

- name: Xiaohongshu
  icon: "social-icon-xiaohongshu"
  url: "#" # TODO: add the Xiaohongshu (RED) profile URL

- name: X
  icon: "fab fa-x-twitter"
  url: "#" # TODO: add the X (Twitter) profile URL


