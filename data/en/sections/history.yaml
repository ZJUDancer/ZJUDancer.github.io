# section information
section:
  # Used both for the top navbar entry and as the heading of the /team/ page.
  # It used to be "Team History".
  name: Team
  id: history
  enable: true
  weight: 3
  # false on purpose: this section has a page of its own (see `url` below), and the theme's
  # footer navigation reads this flag — leaving it true would put a dead "#history" anchor
  # in the footer, because the section is no longer on the home page.
  showOnNavbar: false
  # This section has its own page: the top navbar links to it instead of to a home-page
  # anchor. layouts/partials/navigators/navbar.html resolves it with site.GetPage, so the
  # language prefix and the baseURL sub-path are handled by Hugo.
  url: /team/
  # Not rendered on the home page any more: the timeline is reachable from the navbar only.
  # Read by layouts/index.html.
  hideFromHome: true
  # Local template: renders the timeline as "stage + platform/model + key milestones"
  template: sections/experiences.html

# One-line introduction above the timeline
intro: 

# Field names used on the cards
labels:
  platform: Platform
  model: Model
  events: Key milestones

# Each entry is one stage or one milestone.
#   name         stage name, shown as the card title
#   time         period; use "2026 – present" for ongoing stages
#   company      platform / brand (optional)
#   companyUrl   platform website (optional)
#   logo         brand logo, path relative to assets (optional)
#   model        robot model (optional)
#   overview     stage summary, Markdown supported
#   events[]     milestones: time / text (Markdown supported) / url (optional)
# Competition results live in data/*/sections/accomplishments.yaml; this timeline only
# covers the platform changes and the organisational milestones.
experiences:
- name: In-house Development
  company: Zhejiang University · Self-developed
  companyUrl: http://www.cse.zju.edu.cn
  logo: images/sponsors/ZJUCSE.png
  model: ZJUDancer biped (KidSize)
  time: 2006 – 2025
  overview: >
    Founded in 2006 under the supervision of Prof. Rong Xiong at the College of Control Science and Engineering, Zhejiang University,
    the team works out of the State Key Laboratory of Industrial Control Technology and the ZJU Robotics Education Practice Base
    (the laboratory started its robot soccer programme in 2000 and first entered the RoboCup World Cup in 2003). Members come from
    control, computer science, mechanical, information and biomedical engineering. Everything was built in-house — mechanics,
    electronics, motor drives, motion control, vision and behaviour planning: 20 degrees of freedom, 58–70 cm tall and about 4 kg,
    joints evolving from RX-28 / RX-64 to DYNAMIXEL MX-28 / MX-64 / MX-106, on-board computing from an Intel Atom Z530 and Core i5/i7
    up to NVIDIA Jetson TX1 / TX2 and Orin NX, and motion control moving from a mature ZMP preview controller towards MPC, with a
    reinforcement learning framework first set up in 2025.
  events:
  - time: "2007 / 2009 / 2010"
    text: Won the humanoid KidSize title at the China Robot Competition & RoboCup Open; the 2010 title was defended with a perfect record, 25 goals scored and none conceded.
    url: https://www.zju.edu.cn/2010/0728/c41533a62885/page.htm
  - time: "2013"
    text: Third place at RoboCup in Eindhoven, the team's first World Cup podium. The robot of that year was 58 cm / 4 kg / 20 DoF, using RX-28 and RX-64 servos with an Intel Atom Z530.
  - time: "2014 – 2017"
    text: Joints switched to the DYNAMIXEL MX series and on-board computers to Intel Core i5/i7; runner-up at RoboCup in both 2016 and 2017, plus the 2017 Iran Open title (4:2 against MRL-HSL in the final).
  - time: "2016"
    text: Team website and GitHub organisation went live, with networking and communication modules released publicly.
  - time: "2018"
    text: Computing moved to NVIDIA Jetson TX1/TX2 and the camera to an OmniVision OV2710, robots 62–70 cm tall; fourth place at RoboCup (Montréal) and second in the Drop-In competition.
  - time: "2019"
    text: Runner-up at RoboCup (Sydney, 0:1 against Rhoban in the final) and at the German Open; released open-source examples for colour segmentation and white-balance calibration.
  - time: "2020"
    text: Won the humanoid division of the RoboCup China Open, 7:0 in the final without conceding a single goal — a double title together with ZJUNlict.
    url: http://www.cse.zju.edu.cn/2020/1120/c39283a2714518/page.htm
  - time: "2023"
    text: "Back on the international stage: third place at RoboCup Asia-Pacific (Pyeongchang, Korea) and winner of the Tianjin International Invitational."
  - time: "2024"
    text: Round of 16 at RoboCup (Eindhoven, the Netherlands).
  - time: "2025"
    text: On-board computing upgraded to NVIDIA Jetson Orin NX and some robots fitted with ZED mini stereo cameras; fourth place in KidSize at RoboCup (Salvador, Brazil).

- name: Open-Source Milestone
  time: December 2025
  overview: 
    The team decided to open-source its complete match software, so that new humanoid teams at Chinese universities no longer have to
    build a whole system from scratch — lowering the barrier to entry. It is the first time the twenty-year "our own robots, our own
    software" stack has been opened up as a whole.

# The start date of the Booster K1 stage is based on team-internal information.
# Adjust `time` if the date differs.
- name: Booster Robotics Stage
  company: Booster Robotics (加速进化)
  companyUrl: https://www.booster.tech/cn
  logo: images/sponsors/Booster.webp
  model: Booster K1 (HSL Middle Division)
  time: 2026 – present
  overview: >
    From the 2026 season the team competes on the Booster K1: about 95 cm tall, 19.5 kg and 22 degrees of freedom, listed in the HSL 2026
    rule book among the platforms for the Middle division (up to 125 cm / 25 kg). Walking, kicking and getting up after a fall are now trained
    with reinforcement learning, and the tactics were adapted to the new 2026 rules.
  events:
  - time: "2026"
    text: Switched to Booster K1 as the competition platform; Booster Robotics became a team sponsor.
