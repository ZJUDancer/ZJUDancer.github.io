# section information
section:
  name: Awards
  id: accomplishments
  enable: true
  weight: 2
  showOnNavbar: true
  # Local template: a statistics table with medal icons instead of cards
  template: sections/accomplishments.html
  # Can optionally hide the title in sections
  # hideTitle: true

# One-line description shown above the table
intro: ZJUDancer's competition record, taken from official results pages or contemporary reports. Click a competition name to open the source, or a competition type below to filter the table.

# Competition types used by the filter bar above the table.
# Tabs are generated from this list, in this order, and a tab only shows up when
# at least one record uses that type. A record without a known type falls back to "other".
types:
  - id: world
    name: World Championship
  - id: german
    name: German Open
  - id: rcap
    name: RoboCup Asia-Pacific
  - id: china
    name: RoboCup China Open
  - id: iran
    name: Iran Open

# Table headers and wording of the "award totals" summary
labels:
  all: All competitions
  date: Date
  competition: Competition
  award: Result
  note: Notes
  gold: Gold
  silver: Silver
  bronze: Bronze
  other: Other results
  total: Entries

# Competition records
# type: one of the ids listed under `types` above
# result: gold = champion (1st) / silver = runner-up (2nd) / bronze = third place (3rd) / other
# url points to the official results page published by the organiser of that event
# The notes quote the official standings so every row can be checked against the source
