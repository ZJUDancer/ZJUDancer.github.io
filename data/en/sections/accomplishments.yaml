# One-line description shown above the table
intro: Competitions ZJUDancer has taken part in, and the awards won, since the team was founded in 2006.

# Table headers and wording of the "award totals" summary
labels:
  date: Date
  competition: Competition
  award: Award
  note: Notes
  gold: Gold
  silver: Silver
  bronze: Bronze
