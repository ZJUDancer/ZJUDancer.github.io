# Competition records
# result: gold = champion (1st prize) / silver = runner-up (2nd) / bronze = third place (3rd) / other
# Edit this list and the table plus the totals above it update automatically
competitions:
- date: "2026"
  name: RoboCup German Open
  award: Champion
  result: gold
  note: Reached the final unbeaten (5 wins, 1 draw) and beat defending champions Hamburg Bit-Bots 4:1 — the first Chinese team to win this league.

- date: "2025"
  name: RoboCup World Championship (Brazil)
  award: Fourth place
  result: other
  note: Competed with a fully self-developed robot system and performed consistently under pressure.

- date: "2023"
  name: RoboCup Asia-Pacific Tianjin Invitational
  award: Champion
  result: gold
  note: Won the Humanoid League with stable dynamic walking, accurate vision and efficient strategy execution.

- date: "2023"
  name: RoboCup Asia-Pacific, PyeongChang (Korea)
  award: Third place
  result: bronze
  note: Finished third among a strong field, further strengthening our position in the international humanoid football scene.

- date: "2019"
  name: RoboCup World Championship (Sydney, Australia)
  award: Runner-up
  result: silver
  note: Fought through to the final, reflecting an overall improvement in vision, motion control and system integration.

- date: "2017"
  name: Iran Open
  award: Champion
  result: gold
  note: Topped the field with steady on-site performance and a mature system.

- date: "2017"
  name: RoboCup World Championship (Nagoya, Japan)
  award: Runner-up
  result: silver
  note: Steady progress against high-level opponents earned second place.

- date: "2016"
  name: RoboCup World Championship (Leipzig, Germany)
  award: Runner-up
  result: silver
  note: The robots showed good stability and execution in a complex competition environment.

- date: "2015"
  name: RoboCup World Championship (Hefei, China)
  award: Runner-up
  result: silver
  note: Advanced with strong robot control and teamwork, setting the team's best result at the time.

- date: "2014"
  name: RoboCup World Championship (João Pessoa, Brazil)
  award: Third place
  result: bronze
  note: Took third place after a hard-fought run, showing steadily rising form.

- date: "2013"
  name: RoboCup World Championship (Eindhoven, Netherlands)
  award: Third place
