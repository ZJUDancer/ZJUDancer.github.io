# section information
section:
  name: Media
  id: media
  enable: true
  weight: 5
  # This section has a page of its own; the top navbar links to it via `url`.
  showOnNavbar: false
  url: /media/
  hideFromHome: true
  template: sections/media.html

# One-line introduction above the timeline
intro: Reports, team updates and videos featuring ZJUDancer, newest first. Click a card to read the original story.

# Fixed text used inside the cards
labels:
  read: Read original
  viewLabel: View
  viewDetail: Show details
  viewCover: Covers only

# Story types
categories:
  competition: Match reports
  team: Team updates
  alumni: People & alumni
  video: Video

# Grouped by year, newest first within each year. `date` is month/day only;
# the year is shown by the group heading.
# Each item: title / source / kind / summary / url / image (optional, relative to assets/).
years:
- year: 2026
  items:
  - date: "07"
    title: "RoboCup 2026: the first Humanoid Soccer League World Cup"
    source: RoboCup HSL
    kind: competition
    summary: ZJUDancer competed in the Small division in Incheon, Korea, and finished 5th–8th.
    url: https://hsl.robocup.org/results-2026/

  - date: "04.20"
    title: "2026 RoboCup China Open: ZJUDancer advances from the Small group"
    source: Chinese Association of Automation
    kind: competition
    summary: The official group-stage qualification list confirms ZJUDancer's place in the Small division knockout rounds.
    url: https://rcccaa.drct-caa.org.cn/article_info.php?id=123

  - date: "03.20"
    title: Pi+ platform helps the ZJU team win the German Open
    source: Tencent Cloud Developer Community
    kind: competition
    summary: ZJUDancer reached the final with five wins and one draw, then beat Hamburg Bit-Bots 4:1 to win the Small division.
    url: https://cloud.tencent.com/developer/news/3716257
    image: images/media/german-open-2026-1.jpg

  - date: "03.18"
    title: Chinese and German universities take the honours at the German Open
    source: German Study Abroad / WeChat
    kind: competition
    summary: An on-site report on the German Open, where ZJUDancer beat Hamburg Bit-Bots 4:1 in the final, with photos from the arena.
    url: https://mp.weixin.qq.com/s?__biz=MzAwNDg0Njg2NQ==&mid=2649539426&idx=1&sn=6b57015613caea39ef8a00a7fd9ecc8e
    image: images/media/wechat-german-open-2026.jpg

  - date: "03.15"
    title: "RoboCup German Open 2026: ZJUDancer wins the title"
    source: RoboCup HSL
    kind: competition
    summary: The official results page shows ZJUDancer going 3-1-0 in the group, beating Berlin United 1–0 in the semi-final and Hamburg Bit-Bots 4–1 in the final.
    url: https://hsl.robocup.org/2026-robocup-german-open/

