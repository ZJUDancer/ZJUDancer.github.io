# section information
section:
  # Used both for the top navbar entry and as the heading of the /publications/ page.
  # "Papers" rather than "Publications": the page holds recommended reading by other
  # groups as well as the team's own papers (see the bottom of this file).
  name: Papers
  id: publications
  enable: true
  weight: 6
  # false on purpose (same as "Team" and "Sponsors"): this section has a page of its own
  # (see `url` below), and the theme's footer navigation reads this flag — leaving it true
  # would put a dead "#publications" anchor in the footer, because the section is not on
  # the home page any more.
  showOnNavbar: false
  # This section has its own page: the top navbar links to it instead of to a home-page
  # anchor. layouts/partials/navigators/navbar.html resolves it with site.GetPage, so the
  # language prefix and the baseURL sub-path are handled by Hugo.
  url: /publications/
  # Not rendered on the home page any more: papers are reachable from the navbar only.
  # Read by layouts/index.html.
  hideFromHome: true
  # Can optionally hide the title in sections
  # hideTitle: true

# filter buttons
buttons:
- name: All
  filter: "all"
- name: "Machine Learning"
  filter: "machinelearning"
- name: "Image Processing"
  filter: "image-processing"
- name: Security
  filter: "security"
# To add a "Recommended" group, uncomment the two lines below and give the recommended
# papers categories: ["recommended"]
#- name: Recommended
#  filter: "recommended"

# your publications
# Paper cards, in the order they appear on the page. Each entry:
#   title        paper title
#   publishedIn  journal / conference: name / date / url (url optional)
#   authors[]    author: name / url (url optional)
#   paper        summary (Markdown supported) / url (link to the paper, optional)
#   categories   filter categories; must match a `filter` in `buttons` above
#   tags[]       small tags at the bottom of the card
#
# To add recommended reading (papers by other groups):
#   1. append an entry to this list, filling in authors and publishedIn as usual;
#   2. give it its own category, e.g. categories: ["recommended"];
#   3. enable the "Recommended" button commented out above.
# No template, navbar or home-page change is needed.
