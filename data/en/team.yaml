advisorsHeading: Advisors

# Each advisor: name, photo (path relative to assets/) and bio (Markdown).
advisors:
- name: Rong Xiong (熊蓉)
  photo: images/team/XiongRong.jpg
  bio: |-
    **Professor, PhD supervisor**

    - Member of the expert group on intelligent robots, key special programmes of China's Ministry of Science and Technology
    - Member of the RoboCup International Board
    - Director of the Robotics Laboratory, Institute of Cyber-Systems and Control, Zhejiang University
    - Co-director of the ZJU-UTS Joint Research Centre on Robotics
    - Head of the ZJU Robotics Practice Base for Science Education
    - Zhejiang Provincial "Ten Thousand Talents" Program (science and technology innovation)
    - Zhejiang Provincial "New Century 151" Talents Program, first tier

- name: Xingwen Zheng (郑兴文)
  photo: images/team/ZhengXingwen.jpg
  bio: |-
    **Profile**

    Xingwen Zheng is a Hundred-Talent Program researcher and PhD supervisor at Zhejiang University, a recipient of the National High-level Young Talents Program and a Huawei-ZJU Qizhen Outstanding Young Scholar. He leads the embodied intelligence teaching group at ZJU, serves as vice chair of the RoboCup China Committee, and is an associate editor of IEEE Transactions on Robotics and several other SCI journals.

    He received his PhD from Peking University (supervisor: Prof. Guangming Xie) and the University of Groningen (supervisors: Prof. Ming Cao and Prof. Ajay Kottapalli), and worked at the University of Tokyo as a JSPS postdoctoral fellow (host: Prof. Fumihito Arai). His research covers bio-inspired robotics, underwater robotics, bio-inspired locomotion and biosensor-inspired sensing.

    He has led three research grants (NSFC, JSPS) and taken part in an ERC grant. He has published more than 30 papers, including Nature Communications, IEEE Transactions on Robotics, National Science Review, Advanced Functional Materials and Soft Robotics (five cover papers), one monograph in Chinese and one in English, and 20 granted patents.

    He serves on committees of the Chinese Association of Automation, the Chinese Association for Artificial Intelligence and the China Computer Federation, and holds honours including the IEEE CYBER 2025 Best Conference Paper Nomination, the MARSS 2024 Best Application Paper Nomination and the IOP Outstanding Reviewer Award 2023.

