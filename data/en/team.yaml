advisorsHeading: Advisors

# Each advisor: name, photo (path relative to assets/) and bio (Markdown).
advisors:
- name: Rong Xiong (熊蓉)
  photo: images/team/XiongRong.jpg
  bio: |-
    **Professor, PhD supervisor**

    Professor Rong Xiong works at Zhejiang University, where she researches robot perception, learning and control. She is Director of the Robotics Laboratory at the Institute of Cyber-Systems and Control, Co-director of the ZJU-UTS Joint Research Centre on Robotics, a member of the RoboCup International Board, and a member of the expert group on intelligent robots for China's Ministry of Science and Technology.

    She also heads the ZJU Robotics Practice Base for Science Education, supporting robotics training and competition practice. She is a recipient of Zhejiang Province's "Ten Thousand Talents" Program and a first-tier member of its "New Century 151" Talents Program.

- name: Xingwen Zheng (郑兴文)
  photo: images/team/ZhengXingwen.jpg
  bio: |-
    **Hundred-Talent Program Researcher, PhD supervisor**

    Xingwen Zheng is a Hundred-Talent Program researcher and PhD supervisor at Zhejiang University, a recipient of the National High-level Young Talents Program, vice chair of the RoboCup China Committee, and an associate editor of IEEE Transactions on Robotics. He received his PhD from Peking University and the University of Groningen, and was a JSPS postdoctoral fellow at the University of Tokyo.

    His research focuses on bio-inspired robotics, underwater robotics and bio-inspired sensing, with more than 30 published papers and 20 granted patents.

