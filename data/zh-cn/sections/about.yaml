# section information
section:
  name: 关于我们
  id: about
  enable: true
  weight: 1
  showOnNavbar: true
  # 首页照常展示这个版块，页脚的导航列表也照常列出，只是顶部导航栏不再放它
  # （由 layouts/partials/navigators/navbar.html 读取）
  hideFromTopNavbar: true
  template: sections/about.html

# your designation
designation: RoboCup人形机器人足球队
# your company information
company:
  name: 浙江大学控制科学与工程学院
  url: "http://www.cse.zju.edu.cn"

# a summary about you
summary: 'ZJUDancer依托于工业控制技术国家重点实验室、浙江大学机器人科教实践基地，成立于2006年，在建队20年的时间里，ZJUDancer从独立自主设计制造机器人，到完善运动控制、视觉感知、行为决策等模块代码，逐渐成长为一支有极强竞争力的人形组机器人强队。'

# your social links
# give as many as you want. use font-awesome for the icons.
# 说明：
#   * 名称为 Email 的那一项会被模板自动加上 mailto:，所以这一项的名字不要改。
#   * 图标用 FontAwesome 的类名（主题已打包完整的 FontAwesome 6）。
#     小红书没有官方 FontAwesome 图标，用自定义的 social-icon-xiaohongshu
#     （图形定义在 assets/styles/override.scss 里）。
#   * url 为 "#" 表示占位，等各平台主页地址确定后替换即可。
socialLinks:
- name: Email
  icon: "fas fa-envelope"
  url: "yiran.robotics@gmail.com"

- name: Github
  icon: "fab fa-github"
  url: "https://github.com/ZJUDancer"

- name: YouTube
  icon: "fab fa-youtube"
  url: "https://www.youtube.com/@ZJUDancer"

- name: Bilibili
  icon: "fab fa-bilibili"
  url: "https://space.bilibili.com/3546773001866106?spm_id_from=333.337.0.0"

- name: 小红书
  icon: "social-icon-xiaohongshu"
  url: "#" # TODO: 填入小红书主页地址

- name: X
  icon: "fab fa-x-twitter"
  url: "#" # TODO: 填入 X（Twitter）账号地址

# 赞助商 logo（白底倒角卡片 + webp 格式）
