  note: 一路闯入决赛，体现了视觉感知、运动控制与系统协同方面的整体提升。

- date: "2017"
  name: 伊朗公开赛
  award: 冠军
  result: gold
  note: 凭借稳定的临场发挥和成熟的系统表现成功登顶。

- date: "2017"
  name: RoboCup 机器人世界杯（日本名古屋）
  award: 亚军
