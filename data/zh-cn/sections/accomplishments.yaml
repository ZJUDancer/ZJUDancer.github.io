# section information
section:
  name: 获奖记录
  id: accomplishments
  enable: true
  weight: 2
  showOnNavbar: true
  # 本地模板：以统计表 + 奖牌图标展示，不再使用卡片
  template: sections/accomplishments.html
  # Can optionally hide the title in sections
  # hideTitle: true

# 表格上方的一句话说明
intro: ZJUDancer 的参赛成绩，取自官方成绩页或同期权威报道。点击比赛名称可查看来源，点击下方赛事类型可筛选表格。

# 表格上方筛选栏使用的赛事类型。
# 筛选按钮按此顺序生成，且只有该类型下确实有记录时才会出现；
# 记录中未指定或未列出的 type 会归入 other 分类。
types:
  - id: world
    name: 世界杯
  - id: german
    name: 德国公开赛
  - id: rcap
    name: 亚太赛
  - id: china
    name: 中国赛
  - id: iran
    name: 伊朗公开赛

# 表头与「奖项总计」文案
labels:
  all: 全部赛事
  date: 时间
  competition: 比赛
  award: 成绩
  note: 说明
  gold: 冠军
  silver: 亚军
  bronze: 季军
  other: 其他成绩
  total: 记录条数

# 比赛记录
# type 取值见上方 types；result 取值：gold=冠军（第 1 名）/ silver=亚军（第 2 名）/ bronze=季军（第 3 名）/ other=其他名次
# url 为该项赛事主办方发布的官方成绩页
# 说明栏引用官方原文名次，便于逐条核对
