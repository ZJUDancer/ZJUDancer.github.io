# 比赛记录
# result 取值：gold=冠军（一等奖）/ silver=亚军（二等奖）/ bronze=季军（三等奖）/ other=其他名次
# 修改这里的数据，表格与上方的奖项总计会自动更新
competitions:
- date: "2026"
  name: RoboCup 德国公开赛
  award: 冠军
  result: gold
  note: 以 5 胜 1 平的不败战绩晋级决赛，4:1 击败上届冠军 Hamburg Bit-Bots，中国团队首次在该组别夺冠。

- date: "2025"
  name: RoboCup 机器人世界杯（巴西）
  award: 第四名
  result: other
  note: 完全依靠自主研发的机器人系统参赛，在高强度对抗中保持了稳定发挥。

- date: "2023"
  name: 亚太机器人世界杯天津国际邀请赛
  award: 冠军
  result: gold
  note: 凭借稳定的动态步行、准确的视觉识别与高效的策略执行获得类人组冠军。

- date: "2023"
  name: 亚太机器人世界杯韩国平昌站
  award: 季军
  result: bronze
  note: 在多支强队的竞争中取得季军，进一步巩固了在国际仿人机器人足球领域的竞争力。

- date: "2019"
  name: RoboCup 机器人世界杯（澳大利亚悉尼）
