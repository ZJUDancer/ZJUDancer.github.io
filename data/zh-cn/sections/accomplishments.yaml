  note: 在高水平对抗中稳步前进，最终获得亚军。

- date: "2016"
  name: RoboCup 机器人世界杯（德国莱比锡）
  award: 亚军
  result: silver
  note: 机器人在复杂赛场环境下展现出良好的稳定性与执行力。

- date: "2015"
