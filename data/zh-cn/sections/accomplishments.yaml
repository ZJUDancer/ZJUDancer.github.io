# 表格上方的一句话说明
intro: ZJUDancer 自 2006 年建队以来参加的主要比赛与获奖情况。

# 表头与「奖项总计」文案
labels:
  date: 时间
  competition: 比赛
  award: 奖项
  note: 说明
  gold: 金牌
  silver: 银牌
  bronze: 铜牌
  other: 其他名次
