# 团队分为硬件组和软件组，各组下设有若干方向，如下所示。
skills:
- name: 机械方向
  summary: "参与自研双足机器人的全流程开发，负责机械结构设计、零件定制加工、整机装配与日常维护，让机器人的骨架更轻、更强、更可靠。"
  categories: ["hardware"]

- name: 电路方向
  summary: "负责机器人电路系统的设计、开发、维护与优化，涵盖 PCB 设计与电源管理，保障各个部件稳定、高效地协同工作。"
  categories: ["hardware"]

- name: 视觉感知
  summary: "充分开发双目相机的深度识别能力，训练神经网络视觉里程计，让机器人实时掌握更准确的场上信息，为决策与运动提供可靠感知。"
  categories: ["software"]

- name: 运动控制
  summary: "全面采用强化学习方法训练机器人的行走、踢球与倒地起身等动作，显著提升了机器人的运动速度与稳定性。"
  categories: ["software"]

- name: 行为决策
  summary: "让机器人的决策逻辑适配 2026 新规则的大幅改动，并在战术层面持续深耕，新赛季在策略上依然大有可为。"
  categories: ["software"]
