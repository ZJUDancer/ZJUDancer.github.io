advisorsHeading: 指导老师

# 每位指导老师：name 姓名、photo 照片（路径相对 assets/）、bio 简介（Markdown）
advisors:
- name: 熊蓉
  photo: images/team/XiongRong.jpg
  bio: |-
    **教授、博导**

    熊蓉教授任职于浙江大学，长期从事机器人感知、学习与控制研究，现任浙江大学智能系统与控制研究所机器人实验室主任、浙江大学-悉尼科技大学机器人联合研究中心联执主任，并担任 RoboCup 国际理事会理事、科技部重点专项智能机器人专家组成员，长期参与 RoboCup 相关赛事与学术组织工作。

    她同时负责浙江大学机器人科教实践基地，推动机器人人才培养与竞赛实践，入选浙江省“万人计划”科技创新领军人才、浙江省“新世纪 151 人才工程”第一层次培养人员。

- name: 郑兴文
  photo: images/team/ZhengXingwen.jpg
  bio: |-
    **浙江大学百人计划研究员、博士生导师**

    郑兴文入选国家高层次青年人才计划，担任 RoboCup 中国委员会副主席，以及 IEEE Transactions on Robotics 等期刊副编辑。他博士毕业于北京大学与荷兰 University of Groningen，曾在东京大学担任日本学术振兴会（JSPS）外籍特别研究员。

    他的研究聚焦仿生机器人、水下机器人与仿生智能感知，发表论文 30 余篇，出版中英文专著各一部，获授权专利 20 项。

