[build]
# 生产构建也显式带上 -b，保证 canonical / og:url / 资源路径用的是本站自己的域名，
# 而不是 hugo.yaml 里的兜底 baseURL。
command = "mise install && mise run build -b $URL"
publish = "public"

[build.environment]
HUGO_ENABLEGITINFO = "true"

[context.production.environment]
HUGO_ENV = "production"


[context.deploy-preview]
command = "mise install && mise run build --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "mise install && mise run build -b $DEPLOY_PRIME_URL"
