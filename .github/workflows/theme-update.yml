name: Theme Update

# 每周检查一次主题新版本：有更新就构建验证并开一个 PR，由人来决定是否合并，
# 不直接改主分支。
# 这里跟随主题的正式发布版（v4.x）；如果想跟主题的 main 分支，
# 把下面的 `mise run update` 换成 `mise run update-to-main` 即可。
on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00（UTC+8）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 按 mise.toml 安装 hugo-extended / go / node
      - uses: jdx/mise-action@v5

      # 升级主题依赖，并按新版本重新生成 package.json / package-lock.json
      - name: Update theme
        run: mise run update

      # 构建一次，确认升级后站点仍然能正常生成
      - name: Build site
        run: mise run build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-toha-theme
          delete-branch: true
          labels: dependencies
          commit-message: "chore: 更新 Toha 主题"
          title: "chore: 更新 Toha 主题"
          body: |
            由 `.github/workflows/theme-update.yml` 定时任务自动生成。

            - `mise run update`：把 `github.com/hugo-toha/toha/v4` 升到最新的 v4.x 发布版，
              并重新生成 `package.json` / `package-lock.json`
            - `mise run build`：构建通过

            合并前建议本地 `mise run server` 看一眼页面（尤其是首页背景轮播、
            获奖记录表格和「关于我们」的赞助商卡片）。
