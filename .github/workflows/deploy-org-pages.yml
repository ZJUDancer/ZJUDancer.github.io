name: Deploy ZJUDancer.github.io

# Publish the organization site from the Hugo source on faster_website.
# The repository-level Pages source must be "GitHub Actions"; the workflow
# switches it once before uploading the first artifact.
on:
  push:
    branches: [faster_website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Build site
        run: mise run build -b "https://zjudancer.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
