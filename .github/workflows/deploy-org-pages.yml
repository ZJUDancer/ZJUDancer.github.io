name: Deploy ZJUDancer.github.io

# Publish the organization site from the Hugo source on faster_website.
# The repository-level Pages source must be "GitHub Actions"; the workflow
# switches it once before uploading the first artifact.
on:
  push:
    branches: [faster_website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Build site
        run: mise run build -b "https://zjudancer.github.io/"

      - name: Switch Pages to GitHub Actions
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow'
            });

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
