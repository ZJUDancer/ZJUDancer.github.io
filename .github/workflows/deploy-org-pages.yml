name: Deploy ZJUDancer.github.io

# Publish the organization site from the Hugo source on faster_website.
# The repository-level Pages source is "GitHub Actions".
#
# Do not add a PUT /pages step here: the workflow GITHUB_TOKEN cannot change
# repository Pages settings ("Resource not accessible by integration").
# The github-pages environment protection rule also rejects faster_website,
# so this job intentionally does not bind that environment.
on:
  push:
    branches: [faster_website]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Build site
        run: mise run build -b "https://zjudancer.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
